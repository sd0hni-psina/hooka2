# Runs on the test VPS from /opt/hookah with an .env next to this file.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hookah
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: hookah
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookah"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: ${API_IMAGE:?set API_IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: prod
      # Only Caddy reaches the api, so the last X-Forwarded-For entry is the
      # caller. Kept here, not in .env, so a copied env file cannot switch it off.
      TRUST_PROXY: "true"
      DATABASE_URL: postgres://hookah:${POSTGRES_PASSWORD}@postgres:5432/hookah?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
