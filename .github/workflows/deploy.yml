name: deploy

on:
  push:
    branches: [main]

concurrency: deploy-test-vps

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      API_IMAGE: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: ${{ env.API_IMAGE }}
      - name: copy compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/docker-compose.prod.yml,deploy/Caddyfile
          target: /opt/hookah
          strip_components: 1
      - name: migrate and roll out
        uses: appleboy/ssh-action@v1.2.0
        env:
          API_IMAGE: ${{ env.API_IMAGE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: API_IMAGE
          script: |
            set -euo pipefail
            cd /opt/hookah
            export API_IMAGE
            docker compose -f docker-compose.prod.yml pull api
            docker compose -f docker-compose.prod.yml up -d postgres
            docker compose -f docker-compose.prod.yml run --rm --entrypoint /usr/local/bin/migrate api up
            docker compose -f docker-compose.prod.yml up -d api caddy
            for i in $(seq 1 30); do
              curl -fsS "https://$(grep ^API_DOMAIN= .env | cut -d= -f2)/healthz" && exit 0
              sleep 2
            done
            exit 1
